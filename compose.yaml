services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: codejudge
      POSTGRES_PASSWORD: codejudge
      POSTGRES_DB: codejudge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codejudge -d codejudge"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - codejudge-postgres:/var/lib/postgresql/data

volumes:
  codejudge-postgres:
