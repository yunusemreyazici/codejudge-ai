services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: codejudge
      POSTGRES_PASSWORD: codejudge
      POSTGRES_DB: codejudge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codejudge -d codejudge"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - codejudge-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "6379:6379"
    volumes:
      - codejudge-redis:/data

volumes:
  codejudge-postgres:
  codejudge-redis:
