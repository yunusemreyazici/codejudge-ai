schema_version: "1"
name: repeated-sample-example

dataset:
  id: codejudge-core
  version: "2"

# Two models x seven tasks x three independent samples = 42 planned generations.
samples_per_task: 3

models:
  - provider_id: provider-a
    model: model-a
    display_name: Model A
    temperature: 0
    top_p: 1
    max_output_tokens: 4000

  - provider_id: provider-b
    model: model-b
    display_name: Model B
    temperature: 0
    top_p: 1
    max_output_tokens: 4000

# Values remain environment-only. These entries contain variable names, not endpoints or secrets.
providers:
  provider-a:
    protocol: openai-compatible
    base_url_env: CODEJUDGE_PROVIDER_A_BASE_URL
    credential_env: CODEJUDGE_PROVIDER_A_API_KEY
    output_mode: structured_json
    request_timeout_seconds: 30
  provider-b:
    protocol: openai-compatible
    base_url_env: CODEJUDGE_PROVIDER_B_BASE_URL
    credential_env: CODEJUDGE_PROVIDER_B_API_KEY
    output_mode: structured_json
    request_timeout_seconds: 30

ai_evaluation:
  enabled: false

# Replace these examples with explicit provider pricing reviewed on the recorded date.
pricing:
  provider-a/model-a:
    version: example-2026-08-29
    currency: USD
    input_per_million: 1.00
    output_per_million: 4.00
  provider-b/model-b:
    version: example-2026-08-29
    currency: USD
    input_per_million: 1.00
    output_per_million: 4.00

# Noninteractive execution is permitted only while the full 42-generation estimate fits this cap.
max_generation_cost:
  amount: 10.00
  currency: USD
