[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codejudge-ai"
version = "0.2.0"
description = "A deterministic evaluation framework for testing and scoring code submissions."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Yunus Emre YAZICI" }]
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic>=2.11,<3.0",
    "pytest>=8.4,<10.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.17,<2.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["tasks/definitions/**/*.yaml", "tasks/definitions/**/tests/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
markers = ["sandbox: requires a running Docker daemon and the Phase 2 sandbox image"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
exclude = ["^app/tasks/definitions/.*/tests/"]
pretty = true
show_error_codes = true
warn_unreachable = true
