[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codejudge-ai"
version = "0.7.9"
description = "A distributed evaluation and benchmarking platform for AI-generated code."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Yunus Emre YAZICI" }]
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "bandit>=1.8,<2.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "mypy>=1.17,<2.0",
    "pydantic>=2.11,<3.0",
    "pytest>=8.4,<10.0",
    "pyyaml>=6.0,<7.0",
    "radon>=6.0,<7.0",
    "redis>=6,<8",
    "ruff>=0.12,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.urls]
Repository = "https://github.com/yunusemreyazici/codejudge-ai"
Issues = "https://github.com/yunusemreyazici/codejudge-ai/issues"

[project.scripts]
codejudge-worker = "app.worker.main:main"
codejudge-benchmark-worker = "app.benchmarks.worker_main:main"
codejudge-benchmark = "app.benchmarks.cli:main"

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=1.1,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "analysis/*.ini",
    "benchmarks/datasets/*.json",
    "db/alembic.ini",
    "db/migrations/*.mako",
    "db/migrations/README",
    "db/migrations/versions/*.py",
    "tasks/definitions/**/*.yaml",
    "tasks/definitions/**/tests/*.py",
    "tasks/definitions/**/reference/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
markers = [
    "database: requires a migrated PostgreSQL test database",
    "queue: requires a real Redis service",
    "sandbox: requires a running Docker daemon and the Phase 2 sandbox image",
    "worker_e2e: requires PostgreSQL, Redis, and the Docker sandbox image",
    "ai: exercises the Phase 6 AI assessment layer without an external provider",
    "ai_e2e: requires PostgreSQL, Redis, and the Docker sandbox image with a fake LLM",
    "benchmark_e2e: requires PostgreSQL, Redis, and the Docker sandbox image with fake coding models",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "benchmark-results/generated",
    "benchmark-results/runs",
    "benchmark-results/comparisons",
    "benchmark-results/published",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
exclude = ["^app/tasks/definitions/.*/tests/"]
pretty = true
show_error_codes = true
warn_unreachable = true
