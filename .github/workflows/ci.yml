name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -v -m "not sandbox"

  sandbox:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build sandbox image
        run: docker build -t codejudge-python-sandbox:phase2 sandbox/

      - name: Run Docker sandbox tests
        run: pytest -v -m sandbox tests/sandbox
        env:
          CODEJUDGE_REQUIRE_DOCKER: "1"

      - name: Verify sandbox container cleanup
        run: |
          leaked="$(docker ps -a --filter label=codejudge.component=sandbox --format '{{.Names}}')"
          test -z "$leaked"
