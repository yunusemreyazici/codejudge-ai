          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://codejudge:codejudge@127.0.0.1:5432/codejudge_test
      CODEJUDGE_TEST_DATABASE_URL: postgresql+asyncpg://codejudge:codejudge@127.0.0.1:5432/codejudge_test
      CODEJUDGE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      CODEJUDGE_REQUIRE_DOCKER: "1"
      CODEJUDGE_ALLOW_DESTRUCTIVE_DATABASE_TESTS: "1"
      CODEJUDGE_REQUIRE_DATABASE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Build sandbox image
        run: docker build -t codejudge-python-sandbox:phase2 sandbox/
      - name: Verify Docker benchmark preflight
        run: |
          docker version
          docker info
          docker image inspect codejudge-python-sandbox:phase2
      - name: Run single-task and cross-task fake-model benchmark end-to-end tests
        run: pytest -v tests/queue/test_benchmark_worker_e2e.py
      - name: Verify benchmark sandbox container cleanup
        run: |
          leaked="$(docker ps -a --filter label=codejudge.component=sandbox --format '{{.Names}}')"
          test -z "$leaked"

  worker-e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codejudge
          POSTGRES_PASSWORD: codejudge
